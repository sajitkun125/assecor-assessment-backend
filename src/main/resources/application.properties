# Application Configuration
spring.application.name=assecor-assessment-backend
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.assecor.assessment=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Data Source Configuration
# Options: csv (default) or database
data.source=csv

# CSV Configuration
csv.file.path=sample-input.csv

# H2 Database Configuration (for bonus database feature)
# Uncomment these and set data.source=database to use H2 database
#data.source=database
#spring.datasource.url=jdbc:h2:mem:assecor
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# JSON Output Configuration
spring.jackson.default-property-inclusion=non_null
